aid: assured-allies
name: Assured Allies
description: 'Assured Allies is an insurtech company founded in 2018 by Roee Nahir and Afik Gal, headquartered
  in Boston with an office in Tel Aviv, that partners with long-term care insurance carriers to rebuild
  the LTC category around successful aging. Its platform combines data science, predictive analytics and
  human coaching across four solution lines — NeverStop Wellness (an integrated wellness and rewards program
  the company reports reduces claims by roughly 7%), Digital Underwriting (which it says closes policies
  in about 40 minutes), Product Development for carrier LTCI portfolios, and Distribution Excellence agent
  enablement. Two consumer-facing programs sit on top of the platform: NeverStop (neverstop.com) for the
  wellness-motivated 55+ market and AgeAssured (assured.care) for policyholders aging at home. The company
  raised a $42.5M Series B in 2023 co-led by FinTLV Ventures and Harel Insurance, reports $78M+ raised in
  total, and works with carriers and programs including EquiTrust and CalPERS Long-Term Care. As of this
  profile Assured Allies publishes no public developer portal, API documentation, or machine-readable API
  contract; its member application backend is private and authenticated.'
